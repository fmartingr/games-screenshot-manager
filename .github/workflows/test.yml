name: test

on:
  push:
    branches:
      - latest
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is here on purpose. APFS resolves the NFC and the NFD form of a
        # name to one file, so the Unicode normalization code takes a different
        # path there than it does on Linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      # The PlayStation 4 provider reads the capture date out of the EXIF data,
      # so its test cannot run without the program. The test skips where the
      # program is absent, and this step is what makes it run here instead.
      - name: Install exiftool
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install exiftool
          else
            sudo apt-get update
            sudo apt-get install -y libimage-exiftool-perl
          fi
      - name: Check the formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...
